<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller - Daniel Marchal</title>
</head>
<body>
    <h1>Taller de introducción a la programación</h1>
    <p>Quedan plazas limitadas para esta edición</p>
    <blockquote>"Learning never exhausts the mind " --- Leonardo da Vinci</blockquote>
    <form>
        <label for="nombre">Nombre completo <br> </label>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre y apellidos" required> 

        <br>

        <label for="correo">Correo electrónico <br> </label>
        <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required>

        <br>

        <label for="fecha">Fecha de nacimiento <br> </label>
        <input type="date" id="fecha" name="fecha" required>

        <br>

        <label for="edad">Edad <br> </label>
        <input type="number" id="edad" name="edad" min="16" max="50">

        <br>

        <label for="turno">Turno preferido <br> </label>
        <select name="turno" id="turno" required>
            <option value="maniana">Mañana</option>
            <option value="tarde">Tarde</option>
            <option value="noche">Noche</option>
        </select>

        <br>

        <button type="submit">Inscribirme</button>
        <button type="reset">Borrar formulario</button>

    </form>
</body>
</html>
